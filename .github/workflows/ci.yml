name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: sk_test_mock
      SUPABASE_URL: https://mock.supabase.co
      SUPABASE_ANON_KEY: mock_anon_key
      VITE_SUPABASE_URL: https://mock.supabase.co
      VITE_SUPABASE_ANON_KEY: mock_anon_key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build and Generate Route Tree
        run: pnpm build

      - name: Typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Preflight persisted E2E secrets
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SECRET_E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          SECRET_E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          SECRET_E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          SECRET_E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: |
          missing=()
          for pair in \
            "SECRET_SUPABASE_URL:SUPABASE_URL" \
            "SECRET_SUPABASE_PUBLISHABLE_KEY:SUPABASE_PUBLISHABLE_KEY" \
            "SECRET_E2E_ADMIN_EMAIL:E2E_ADMIN_EMAIL" \
            "SECRET_E2E_ADMIN_PASSWORD:E2E_ADMIN_PASSWORD" \
            "SECRET_E2E_NON_ADMIN_EMAIL:E2E_NON_ADMIN_EMAIL" \
            "SECRET_E2E_NON_ADMIN_PASSWORD:E2E_NON_ADMIN_PASSWORD"
          do
            secret_name="${pair%%:*}"
            public_name="${pair#*:}"
            if [ -z "${!secret_name}" ]; then
              missing+=("$public_name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Persisted governed workflow E2E will skip; missing secret-backed env var(s): %s\n' "${missing[*]}"
          else
            echo "Persisted governed workflow E2E secret-backed env is configured."
          fi

      - name: Preflight Supabase credential login
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: node .github/scripts/preflightAuth.mjs

      - name: E2E
        env:
          SECRET_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SECRET_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SECRET_E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          SECRET_E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          SECRET_E2E_NON_ADMIN_EMAIL: ${{ secrets.E2E_NON_ADMIN_EMAIL }}
          SECRET_E2E_NON_ADMIN_PASSWORD: ${{ secrets.E2E_NON_ADMIN_PASSWORD }}
        run: |
          missing=()
          for pair in \
            "SECRET_SUPABASE_URL:SUPABASE_URL" \
            "SECRET_SUPABASE_PUBLISHABLE_KEY:SUPABASE_PUBLISHABLE_KEY" \
            "SECRET_E2E_ADMIN_EMAIL:E2E_ADMIN_EMAIL" \
            "SECRET_E2E_ADMIN_PASSWORD:E2E_ADMIN_PASSWORD" \
            "SECRET_E2E_NON_ADMIN_EMAIL:E2E_NON_ADMIN_EMAIL" \
            "SECRET_E2E_NON_ADMIN_PASSWORD:E2E_NON_ADMIN_PASSWORD"
          do
            secret_name="${pair%%:*}"
            public_name="${pair#*:}"
            if [ -z "${!secret_name}" ]; then
              missing+=("$public_name")
            fi
          done

          if [ "${#missing[@]}" -eq 0 ]; then
            export SUPABASE_URL="$SECRET_SUPABASE_URL"
            export SUPABASE_PUBLISHABLE_KEY="$SECRET_SUPABASE_PUBLISHABLE_KEY"
            export VITE_SUPABASE_URL="$SECRET_SUPABASE_URL"
            export VITE_SUPABASE_PUBLISHABLE_KEY="$SECRET_SUPABASE_PUBLISHABLE_KEY"
            export E2E_ADMIN_EMAIL="$SECRET_E2E_ADMIN_EMAIL"
            export E2E_ADMIN_PASSWORD="$SECRET_E2E_ADMIN_PASSWORD"
            export E2E_NON_ADMIN_EMAIL="$SECRET_E2E_NON_ADMIN_EMAIL"
            export E2E_NON_ADMIN_PASSWORD="$SECRET_E2E_NON_ADMIN_PASSWORD"
            export PERSISTED_GOVERNED_E2E=1
            echo "Persisted governed workflow E2E enabled."
          else
            export PERSISTED_GOVERNED_E2E=0
            printf 'Persisted governed workflow E2E disabled; missing secret-backed env var(s): %s\n' "${missing[*]}"
          fi

          pnpm test:e2e
